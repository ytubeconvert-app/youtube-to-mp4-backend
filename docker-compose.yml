version: '3.8'

services:
  converter-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-to-mp4-backend
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - NODE_ENV=production
      - ENFORCE_SIGNATURE=false
      - MAX_VIDEO_DURATION_SECONDS=7200
      - MAX_FILE_SIZE_MB=1500
      - FILE_EXPIRATION_MINUTES=15
      - CLEANUP_INTERVAL_MINUTES=5
      - TEMP_DIR=/app/temp_downloads
      - MAX_CONCURRENT_JOBS=4
    volumes:
      - temp_data:/app/temp_downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  temp_data:
